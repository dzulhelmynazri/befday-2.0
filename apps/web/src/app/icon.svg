<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <style>
    .bg {
      fill: #faf9f5;
      stroke: #dad9d4;
    }
    .fg {
      fill: #181614;
    }
    .flame {
      fill: #c96442;
    }
    @media (prefers-color-scheme: dark) {
      .bg {
        fill: #262624;
        stroke: #454540;
      }
      .fg {
        fill: #faf9f5;
      }
      .flame {
        fill: #d97757;
      }
    }
  </style>

  <!-- Adaptive Rounded Badge -->
  <rect class="bg" x="6" y="6" width="500" height="500" rx="108" stroke-width="12" />

  <!-- Candle flames -->
  <path class="flame" d="M256 44 C243 66 234 84 234 99 C234 112 244 122 256 122 C268 122 278 112 278 99 C278 84 269 66 256 44 Z" />
  <path class="flame" d="M180 62 C168 82 160 98 160 111 C160 123 169 132 180 132 C191 132 200 123 200 111 C200 98 192 82 180 62 Z" />
  <path class="flame" d="M332 62 C320 82 312 98 312 111 C312 123 321 132 332 132 C343 132 352 123 352 111 C352 98 344 82 332 62 Z" />

  <!-- Candle sticks -->
  <rect class="fg" x="244" y="134" width="24" height="56" rx="12" />
  <rect class="fg" x="168" y="144" width="24" height="46" rx="12" />
  <rect class="fg" x="320" y="144" width="24" height="46" rx="12" />

  <!-- Cake Top Tier with Scalloped Frosting -->
  <path class="fg" d="M128 232 A28 28 0 0 1 156 204 H356 A28 28 0 0 1 384 232 V262 A32 32 0 0 1 320 262 A32 32 0 0 1 256 262 A32 32 0 0 1 192 262 A32 32 0 0 1 128 262 Z" />

  <!-- Cake Bottom Tier -->
  <rect class="fg" x="96" y="314" width="320" height="96" rx="28" />

  <!-- Cake Plate -->
  <rect class="fg" x="64" y="428" width="384" height="34" rx="17" />
</svg>

