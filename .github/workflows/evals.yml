name: Agent Evals

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - "packages/**"
      - ".github/workflows/evals.yml"
  push:
    branches:
      - main
    paths:
      - "apps/agent/**"
      - "packages/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

jobs:
  evals:
    name: Eve Agent Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Eve Evals
        run: bun run eval:agent -- --tag fast --strict --junit .eve/junit.xml
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Upload Eval Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-eval-results
          path: |
            apps/agent/.eve/junit.xml
            apps/agent/.eve/evals/
